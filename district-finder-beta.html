<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Find Your MUSD Trustee Area</title>
  <!-- MUSD District Finder v1.8 -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
</head>

<body>

  <!--
    Portable, deliberately neutral Web Component.

    Host-site theming example:

    musd-district-finder {
      --finder-accent: #8a4f2b;
      --finder-font: Georgia, serif;
      --finder-radius: 6px;
    }
  -->
  <musd-district-finder></musd-district-finder>

<script>
class MusdDistrictFinder extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: "open" });

    this.map = null;
    this.allAreasLayer = null;
    this.districtOutlineLayer = null;
    this.areaLabelsLayer = null;
    this.addressMarker = null;

    /*
      CURRENT OFFICIAL COUNTY SOURCE

      San Bernardino County ROV's "District Look-up by Address" page
      currently launches this ArcGIS Instant Apps Zone Lookup app.

      We resolve the app -> Web Map -> operational layers at runtime,
      then find the layer that actually returns the MUSD trustee area
      for the entered address. We intentionally do NOT fall back to the
      older 2021 redistricting shapefile because it visibly disagrees
      with the County's current lookup.
    */
    this.COUNTY_ZONE_LOOKUP_APP_ID = "147ff78591d84f8fa440355f60583f8a";
    this._officialLookupLayers = null;

    /*
      Address autosuggest state.
    */
    this._suggestTimer = null;
    this._suggestRequestId = 0;
    this._activeSuggestion = -1;

    /*
      Election-specific data is intentionally isolated here.
      Candidate order is rendered alphabetically by surname.
    */
    this.MUSD_2026 = {
      electionDate: "November 3, 2026",

      1: {
        contest: "Member, Governing Board Area 1 - Short Term",
        candidates: [
          { name: "Vadim Altschuler", surname: "Altschuler" },
          { name: 'Melissa "Missy" Bond', surname: "Bond" },
          { name: "Ruben Rodriguez", surname: "Rodriguez" }
        ]
      },

      2: { contest: null, candidates: [] },
      3: { contest: null, candidates: [] },
      4: { contest: null, candidates: [] },

      5: {
        contest: "Member, Governing Board Area 5",
        candidates: [
          { name: "Linda Hamilton", surname: "Hamilton" },
          { name: "Roberta Joanna Meyers", surname: "Meyers" },
          { name: "Juan Carlos Pineiro", surname: "Pineiro" }
        ]
      }
    };
  }

  connectedCallback() {
    this.render();
    this.cache();
    this.bind();
  }

  render() {
    this.shadowRoot.innerHTML = `
      <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

      <style>

          --finder-text: #171717;

          --finder-radius: 14px;
          --finder-max-width: 860px;

      </style>


      <article class="finder">

        <!-- INITIAL STATE -->
        <section class="search" id="searchSection">

                id="addressInput"
                type="text"
                autocomplete="off"
                spellcheck="false"

                aria-expanded="false"

                class="suggestions hidden"

                role="listbox"

              ></div>

  }

  cache() {
    const $ = id => this.shadowRoot.getElementById(id);

    this.searchSection = $("searchSection");
    this.addressForm = $("addressForm");
    this.addressInput = $("addressInput");
    this.addressSuggestionsEl = $("addressSuggestions");
    this.lookupButton = $("lookupButton");
    this.statusEl = $("status");

    this.resultsSection = $("resultsSection");
    this.normalizedAddressEl = $("normalizedAddress");
    this.changeButton = $("changeButton");

    this.areaValueEl = $("areaValue");
    this.candidateHeadingEl = $("candidateHeading");
    this.candidateListEl = $("candidateList");
    this.candidateNoteEl = $("candidateNote");

    this.stateLowerEl = $("stateLower");
    this.stateUpperEl = $("stateUpper");
    this.federalLowerEl = $("federalLower");
    this.federalUpperEl = $("federalUpper");

    this.mapEl = $("map");
  }

  bind() {
    this.addressForm.addEventListener(
      "submit",
      event => this.handleLookup(event)
    );

    this.changeButton.addEventListener(
      "click",
      () => this.changeAddress()
    );

    this.addressInput.addEventListener(
      "input",
      () => this.scheduleSuggestions()
    );

    this.addressInput.addEventListener(
      "keydown",
      event => this.handleSuggestionKeys(event)
    );

    this.addressInput.addEventListener(
      "blur",
      () => {
        // Keep the list alive long enough for a pointer click to land.
        setTimeout(() => this.hideSuggestions(), 140);
      }
    );
  }

  show(el) {
    el.classList.remove("hidden");
  }

  hide(el) {
    el.classList.add("hidden");
  }

  setStatus(message = "", isError = false) {
    this.statusEl.textContent = message;
    this.statusEl.classList.toggle("error", isError);
  }

  setBusy(isBusy) {
    this.lookupButton.disabled = isBusy;
    this.lookupButton.textContent = isBusy ? "Finding…" : "Find my area";
    this.setAttribute("aria-busy", isBusy ? "true" : "false");
  }

  ensureCalifornia(address) {
    return /\bCA\b|\bCalifornia\b/i.test(address)
      ? address
      : `${address}, CA`;
  }

  /*
    U.S. Census browser-side geocoding using JSONP.
    Returns normalized address, coordinates and current geography fields.
  */
  censusGeocode(address) {
    return new Promise((resolve, reject) => {
      const callback =
        "__census_" + Date.now() + "_" + Math.floor(Math.random() * 1000000);

      const script = document.createElement("script");
      let timer;

      const cleanup = () => {
        clearTimeout(timer);
        try { delete window[callback]; } catch (_) {}
        script.remove();
      };

      window[callback] = data => {
        try {
          const matches = data?.result?.addressMatches || [];

          if (!matches.length) {
            cleanup();
            reject(new Error(
              "We couldn’t find that address. Try including the city and ZIP code."
            ));
            return;
          }

          const match = matches[0];
          const lat = Number(match.coordinates?.y);
          const lng = Number(match.coordinates?.x);

          if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
            cleanup();
            reject(new Error("The address matched, but its coordinates were unavailable."));
            return;
          }

          const result = {
            matchedAddress: match.matchedAddress || address,
            lat,
            lng,
            geographies: match.geographies || {}
          };

          cleanup();
          resolve(result);

        } catch (error) {
          cleanup();
          reject(error);
        }
      };

      script.onerror = () => {
        cleanup();
        reject(new Error("The address service could not be reached."));
      };

      timer = setTimeout(() => {
        cleanup();
        reject(new Error("The address lookup timed out. Please try again."));
      }, 15000);

      const params = new URLSearchParams({
        address: this.ensureCalifornia(address),
        benchmark: "Public_AR_Current",
        vintage: "Current_Current",
        format: "jsonp",
        callback
      });

      script.src =
        "https://geocoding.geo.census.gov/geocoder/geographies/onelineaddress?" +
        params.toString();

      document.head.appendChild(script);
    });
  }

  /*
    Lightweight address proposals using the same Census geocoder already
    used for final normalization. This requires no API key and avoids
    sending the address to an additional commercial service.

    The Census service is not a full Google-Places-style autocomplete
    engine, so suggestions generally appear once enough of a real street
    address has been typed to produce a match.
  */
  censusAddressSuggestions(address) {
    return new Promise(resolve => {
      const callback =
        "__censusSuggest_" +
        Date.now() +
        "_" +
        Math.floor(Math.random() * 1000000);

      const script = document.createElement("script");
      let timer;

      const cleanup = () => {
        clearTimeout(timer);
        try { delete window[callback]; } catch (_) {}
        script.remove();
      };

      window[callback] = data => {
        const matches =
          data?.result?.addressMatches || [];

        cleanup();

        resolve(
          matches
            .slice(0, 5)
            .map(match => ({
              matchedAddress:
                match.matchedAddress || address,
              lat: Number(match.coordinates?.y),
              lng: Number(match.coordinates?.x)
            }))
            .filter(
              match =>
                match.matchedAddress &&
                Number.isFinite(match.lat) &&
                Number.isFinite(match.lng)
            )
        );
      };

      script.onerror = () => {
        cleanup();
        resolve([]);
      };

      timer = setTimeout(() => {
        cleanup();
        resolve([]);
      }, 7000);

      const params = new URLSearchParams({
        address: this.ensureCalifornia(address),
        benchmark: "Public_AR_Current",
        format: "jsonp",
        callback
      });

      script.src =
        "https://geocoding.geo.census.gov/geocoder/locations/onelineaddress?" +
        params.toString();

      document.head.appendChild(script);
    });
  }

  scheduleSuggestions() {
    clearTimeout(this._suggestTimer);
    this._activeSuggestion = -1;

    const value = this.addressInput.value.trim();

    if (
      value.length < 7 ||
      !/\d/.test(value)
    ) {
      this.hideSuggestions();
      return;
    }

    const requestId = ++this._suggestRequestId;

    this._suggestTimer = setTimeout(
      async () => {
        const suggestions =
          await this.censusAddressSuggestions(value);

        if (requestId !== this._suggestRequestId) {
          return;
        }

        this.renderSuggestions(suggestions);
      },
      450
    );
  }

  renderSuggestions(suggestions) {
    this.addressSuggestionsEl.innerHTML = "";
    this._activeSuggestion = -1;

    const unique = [];
    const seen = new Set();

    for (const suggestion of suggestions) {
      const key =
        suggestion.matchedAddress.toUpperCase();

      if (seen.has(key)) continue;

      seen.add(key);
      unique.push(suggestion);
    }

    if (!unique.length) {
      this.hideSuggestions();
      return;
    }

    unique.forEach((suggestion, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "suggestion";
      button.setAttribute("role", "option");
      button.dataset.index = String(index);

      const main = document.createElement("span");
      main.className = "suggestion-main";
      main.textContent = suggestion.matchedAddress;

      const note = document.createElement("span");
      note.className = "suggestion-note";
      note.textContent = "Use this address";

      button.append(main, note);

      button.addEventListener(
        "mousedown",
        event => event.preventDefault()
      );

      button.addEventListener(
        "click",
        () => {
          this.addressInput.value =
            suggestion.matchedAddress;

          this.hideSuggestions();

          // Selecting a proposal is an explicit user choice, so run it.
          this.addressForm.requestSubmit();
        }
      );

      this.addressSuggestionsEl.appendChild(button);
    });

    this.show(this.addressSuggestionsEl);
    this.addressInput.setAttribute(
      "aria-expanded",
      "true"
    );
  }

  hideSuggestions() {
    this.hide(this.addressSuggestionsEl);
    this.addressSuggestionsEl.innerHTML = "";
    this.addressInput.setAttribute(
      "aria-expanded",
      "false"
    );
    this._activeSuggestion = -1;
  }

  suggestionButtons() {
    return [
      ...this.addressSuggestionsEl.querySelectorAll(
        ".suggestion"
      )
    ];
  }

  handleSuggestionKeys(event) {
    const buttons = this.suggestionButtons();

    if (!buttons.length) {
      return;
    }

    if (event.key === "Escape") {
      this.hideSuggestions();
      return;
    }

    if (
      event.key !== "ArrowDown" &&
      event.key !== "ArrowUp" &&
      event.key !== "Enter"
    ) {
      return;
    }

    if (event.key === "Enter") {
      if (this._activeSuggestion >= 0) {
        event.preventDefault();
        buttons[this._activeSuggestion].click();
      }
      return;
    }

    event.preventDefault();

    const delta =
      event.key === "ArrowDown" ? 1 : -1;

    this._activeSuggestion =
      (
        this._activeSuggestion +
        delta +
        buttons.length
      ) % buttons.length;

    buttons.forEach((button, index) => {
      button.classList.toggle(
        "active",
        index === this._activeSuggestion
      );
    });
  }

  findGeographyGroup(geographies, predicate) {
    for (const [key, value] of Object.entries(geographies || {})) {
      if (predicate(key) && Array.isArray(value) && value.length) {
        return value[0];
      }
    }

    return null;
  }

  numberFromText(value) {
    if (!value) return null;
    const match = String(value).match(/\b(\d{1,3})\b/);
    return match ? match[1] : null;
  }

  legislativeInfo(geographies) {
    const state = this.findGeographyGroup(
      geographies,
      key => /^States$/i.test(key) || /\bStates\b/i.test(key)
    );

    const lower = this.findGeographyGroup(
      geographies,
      key =>
        /State Legislative District/i.test(key) &&
        /Lower/i.test(key)
    );

    const upper = this.findGeographyGroup(
      geographies,
      key =>
        /State Legislative District/i.test(key) &&
        /Upper/i.test(key)
    );

    const congress = this.findGeographyGroup(
      geographies,
      key => /Congressional District/i.test(key)
    );

    return {
      stateName: state?.NAME || "California",

      stateLower:
        lower?.BASENAME ||
        lower?.SLDLST ||
        this.numberFromText(lower?.NAME),

      stateUpper:
        upper?.BASENAME ||
        upper?.SLDUST ||
        this.numberFromText(upper?.NAME),

      congressional:
        congress?.BASENAME ||
        congress?.CD ||
        this.numberFromText(congress?.NAME)
    };
  }

  /*
    Return a real, human-readable trustee-area label only.

    Earlier builds searched every property whose key contained "area".
    ArcGIS housekeeping fields such as Shape__Area are numeric, and that
    could falsely turn an extra geometry into "Area 1". We never inspect
    those numeric geometry fields now.
  */
  musdLabel(feature) {
    const props = feature?.properties || {};

    const explicitKeys = [
      "TrusteeArea",
      "TRUSTEE_AREA",
      "Trustee_Area",
      "trustee_area",
      "AREA",
      "Area",
      "area",
      "NAME",
      "Name",
      "name",
      "DISTRICT",
      "District",
      "district"
    ];

    for (const key of explicitKeys) {
      const value = props[key];

      if (typeof value === "string" && value.trim()) {
        return value.trim();
      }

      if (
        typeof value === "number" &&
        /^(AREA|Area|area|DISTRICT|District|district)$/.test(key) &&
        Number.isInteger(value) &&
        value >= 1 &&
        value <= 5
      ) {
        return String(value);
      }
    }

    /*
      Conservative fallback: strings only.
      Never accept raw numeric GIS measurements.
    */
    for (const [key, value] of Object.entries(props)) {
      if (typeof value !== "string" || !value.trim()) continue;
      if (!/(trustee|district|area|name|label)/i.test(key)) continue;

      const s = value.trim();

      if (
        /\b(?:trustee\s*)?area\s*[1-5]\b/i.test(s) ||
        /\bdistrict\s*[1-5]\b/i.test(s) ||
        /^[1-5]$/.test(s)
      ) {
        return s;
      }
    }

    return null;
  }

  areaNumber(feature) {
    const label = this.musdLabel(feature);
    if (!label) return null;

    const patterns = [
      /\b(?:trustee\s*)?area\s*([1-5])\b/i,
      /\bdistrict\s*([1-5])\b/i,
      /^\s*([1-5])\s*$/
    ];

    for (const pattern of patterns) {
      const match = String(label).match(pattern);
      if (match) return Number(match[1]);
    }

    return null;
  }

  async fetchJson(url, label = "Request") {
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error(
        `${label}: HTTP ${response.status}`
      );
    }

    const data = await response.json();

    if (data?.error) {
      throw new Error(
        `${label}: ` +
        (data.error.message || "ArcGIS error")
      );
    }

    return data;
  }

  /*
    Collect ArcGIS item IDs from the CURRENT official County Zone Lookup
    app configuration. Instant Apps store the selected Web Map as an
    item ID inside the app data.
  */
  collectArcgisItemIds(value, keyPath = "", out = []) {
    if (typeof value === "string") {
      if (/^[0-9a-f]{32}$/i.test(value)) {
        let score = 0;

        if (/web.?map/i.test(keyPath)) score += 20;
        if (/\bmap\b/i.test(keyPath)) score += 8;
        if (/item/i.test(keyPath)) score += 3;

        out.push({
          id: value,
          score,
          keyPath
        });
      }

      return out;
    }

    if (Array.isArray(value)) {
      value.forEach(
        (entry, index) =>
          this.collectArcgisItemIds(
            entry,
            `${keyPath}[${index}]`,
            out
          )
      );

      return out;
    }

    if (value && typeof value === "object") {
      Object.entries(value).forEach(
        ([key, entry]) =>
          this.collectArcgisItemIds(
            entry,
            keyPath ? `${keyPath}.${key}` : key,
            out
          )
      );
    }

    return out;
  }

  collectWebMapLayers(
    layers,
    parentTitle = "",
    parentUrl = "",
    out = []
  ) {
    for (const layer of layers || []) {
      const title =
        layer.title ||
        layer.name ||
        parentTitle ||
        "";

      let url =
        layer.url ||
        layer.serviceUrl ||
        "";

      /*
        Some Web Map group/sublayers inherit their service URL from a
        parent and provide only a numeric sublayer id.
      */
      if (
        !url &&
        parentUrl &&
        Number.isInteger(layer.id)
      ) {
        url =
          parentUrl.replace(/\/$/, "") +
          "/" +
          layer.id;
      }

      if (url) {
        out.push({
          title,
          parentTitle,
          url: url.replace(/\/$/, ""),
          definitionExpression:
            layer.layerDefinition
              ?.definitionExpression ||
            layer.definitionExpression ||
            ""
        });
      }

      if (layer.layers?.length) {
        this.collectWebMapLayers(
          layer.layers,
          title,
          url || parentUrl,
          out
        );
      }
    }

    return out;
  }

  async officialDistrictLayers() {
    if (this._officialLookupLayers) {
      return this._officialLookupLayers;
    }

    const appData = await this.fetchJson(
      `https://www.arcgis.com/sharing/rest/content/items/` +
      `${this.COUNTY_ZONE_LOOKUP_APP_ID}/data?f=json`,
      "County District Look-up app"
    );

    const candidates =
      this.collectArcgisItemIds(appData)
        .sort((a, b) => b.score - a.score);

    const seen = new Set();
    const webMapIds = [];

    for (const candidate of candidates) {
      if (seen.has(candidate.id)) continue;
      seen.add(candidate.id);

      try {
        const meta = await this.fetchJson(
          `https://www.arcgis.com/sharing/rest/content/items/` +
          `${candidate.id}?f=json`,
          "ArcGIS item"
        );

        if (meta.type === "Web Map") {
          webMapIds.push(candidate.id);
        }
      } catch (_) {}

      if (webMapIds.length >= 4) break;
    }

    if (!webMapIds.length) {
      throw new Error(
        "Could not resolve the current County District Look-up map."
      );
    }

    const layers = [];

    for (const webMapId of webMapIds) {
      const webMap = await this.fetchJson(
        `https://www.arcgis.com/sharing/rest/content/items/` +
        `${webMapId}/data?f=json`,
        "County District Look-up web map"
      );

      this.collectWebMapLayers(
        webMap.operationalLayers,
        "",
        "",
        layers
      );
    }

    const unique = [];
    const keys = new Set();

    for (const layer of layers) {
      const key =
        `${layer.url}|${layer.definitionExpression}`;

      if (keys.has(key)) continue;
      keys.add(key);
      unique.push(layer);
    }

    if (!unique.length) {
      throw new Error(
        "The County District Look-up map contained no queryable layers."
      );
    }

    /*
      Likely school/trustee layers first, but keep every layer available
      as a fallback because County layer names can change.
    */
    unique.sort((a, b) => {
      const score = layer => {
        const text =
          `${layer.title} ${layer.parentTitle}`;

        let value = 0;

        if (/morongo/i.test(text)) value += 20;
        if (/school/i.test(text)) value += 8;
        if (/trustee|governing/i.test(text)) value += 8;
        if (/district/i.test(text)) value += 4;

        return value;
      };

      return score(b) - score(a);
    });

    this._officialLookupLayers = unique;
    return unique;
  }

  layerWhere(layer) {
    return layer.definitionExpression?.trim()
      ? `(${layer.definitionExpression})`
      : "1=1";
  }

  async queryLayerAtPoint(layer, lat, lng) {
    const params = new URLSearchParams({
      f: "geojson",
      where: this.layerWhere(layer),
      geometry: `${lng},${lat}`,
      geometryType: "esriGeometryPoint",
      inSR: "4326",
      spatialRel: "esriSpatialRelIntersects",
      outFields: "*",
      returnGeometry: "true",
      outSR: "4326"
    });

    return this.fetchJson(
      `${layer.url}/query?${params.toString()}`,
      layer.title || "County district layer"
    );
  }

  async queryLayerInMorongo(layer) {
    /*
      Deliberately broad envelope covering the Morongo Basin/MUSD.
      It keeps a countywide district layer response small enough to
      inspect in-browser.
    */
    const envelope = {
      xmin: -117.05,
      ymin: 33.68,
      xmax: -115.25,
      ymax: 34.62,
      spatialReference: { wkid: 4326 }
    };

    const params = new URLSearchParams({
      f: "geojson",
      where: this.layerWhere(layer),
      geometry: JSON.stringify(envelope),
      geometryType: "esriGeometryEnvelope",
      inSR: "4326",
      spatialRel: "esriSpatialRelIntersects",
      outFields: "*",
      returnGeometry: "true",
      outSR: "4326",
      resultRecordCount: "2000"
    });

    return this.fetchJson(
      `${layer.url}/query?${params.toString()}`,
      layer.title || "County district layer"
    );
  }

  featureText(feature) {
    return Object.entries(
      feature?.properties || {}
    )
      .filter(
        ([, value]) =>
          value !== null &&
          value !== undefined
      )
      .map(
        ([key, value]) =>
          `${key}:${String(value)}`
      )
      .join(" ");
  }

  /*
    Strictly read a trustee-area number from a semantic field/value.
    Never infer from OBJECTID, Shape__Area, geometry size, etc.
  */
  currentAreaNumber(feature) {
    const props = feature?.properties || {};

    const explicitKeys = [
      "TrusteeArea",
      "TRUSTEE_AREA",
      "Trustee_Area",
      "trustee_area",
      "AREA",
      "Area",
      "area",
      "DISTRICT",
      "District",
      "district",
      "DIVISION",
      "Division",
      "division",
      "NAME",
      "Name",
      "name",
      "LABEL",
      "Label",
      "label"
    ];

    const parse = value => {
      if (
        typeof value === "number" &&
        Number.isInteger(value) &&
        value >= 1 &&
        value <= 5
      ) {
        return value;
      }

      if (typeof value !== "string") {
        return null;
      }

      const patterns = [
        /\b(?:trustee\s*)?area\s*([1-5])\b/i,
        /\bdistrict\s*([1-5])\b/i,
        /\bdivision\s*([1-5])\b/i,
        /^\s*([1-5])\s*$/
      ];

      for (const pattern of patterns) {
        const match = value.match(pattern);
        if (match) return Number(match[1]);
      }

      return null;
    };

    for (const key of explicitKeys) {
      if (props[key] === undefined) continue;

      const value = parse(props[key]);

      if (value) return value;
    }

    /*
      Conservative string fallback only.
    */
    for (const [key, value] of Object.entries(props)) {
      if (
        typeof value !== "string" ||
        !/(trustee|area|district|division|name|label)/i.test(key)
      ) {
        continue;
      }

      const parsed = parse(value);
      if (parsed) return parsed;
    }

    return null;
  }

  featureIsMorongo(feature, layer) {
    const titleText =
      `${layer.title || ""} ${layer.parentTitle || ""}`;

    if (/morongo/i.test(titleText)) {
      return true;
    }

    return /morongo\s+unified|morongo.*school/i.test(
      this.featureText(feature)
    );
  }

  /*
    Resolve current MUSD trustee geometry directly from the same layers
    used by the County's current District Look-up app.

    We first test the entered point against likely layers, then require
    the same layer to yield Areas 1–5 in the Morongo Basin.
  */
  async officialMusdAreasForPoint(lat, lng) {
    const layers = await this.officialDistrictLayers();

    for (const layer of layers) {
      let pointData;

      try {
        pointData =
          await this.queryLayerAtPoint(
            layer,
            lat,
            lng
          );
      } catch (_) {
        continue;
      }

      const pointHits =
        (pointData?.features || [])
          .map(feature => ({
            feature,
            area:
              this.currentAreaNumber(feature),
            morongo:
              this.featureIsMorongo(
                feature,
                layer
              )
          }))
          .filter(
            hit =>
              hit.area &&
              hit.morongo
          );

      if (!pointHits.length) {
        continue;
      }

      let basinData;

      try {
        basinData =
          await this.queryLayerInMorongo(layer);
      } catch (_) {
        continue;
      }

      const clean = [];

      for (const original of basinData?.features || []) {
        const area =
          this.currentAreaNumber(original);

        if (!area) continue;

        if (
          !this.featureIsMorongo(
            original,
            layer
          )
        ) {
          continue;
        }

        clean.push({
          type: "Feature",
          properties: {
            ...(original.properties || {}),
            __trusteeArea: area
          },
          geometry: original.geometry
        });
      }

      const present = new Set(
        clean.map(
          feature =>
            Number(
              feature.properties.__trusteeArea
            )
        )
      );

      const hasAllFive =
        [1, 2, 3, 4, 5].every(
          area => present.has(area)
        );

      if (!hasAllFive) {
        continue;
      }

      /*
        The point hit itself is authoritative for the answer, while the
        clean collection from the same current layer is authoritative
        for map display.
      */
      const selectedArea =
        pointHits[0].area;

      return {
        areaNumber: selectedArea,
        geojson: {
          type: "FeatureCollection",
          features: clean
        },
        sourceLayerTitle:
          layer.title || layer.parentTitle || "County district layer"
      };
    }

    throw new Error(
      "The current County District Look-up did not return an MUSD trustee area for this address."
    );
  }


  renderCandidates(areaNumber) {
    const info = this.MUSD_2026[areaNumber];

    this.candidateListEl.innerHTML = "";

    if (!info?.contest) {
      this.candidateHeadingEl.textContent = "2026 MUSD election";
      this.candidateNoteEl.textContent =
        "No MUSD trustee contest for this area is listed in the current November 3, 2026 candidate list.";
      return;
    }

    this.candidateHeadingEl.textContent = "2026 candidates";

    [...info.candidates]
      .sort((a, b) =>
        a.surname.localeCompare(b.surname, "en", { sensitivity: "base" })
      )
      .forEach(candidate => {
        const li = document.createElement("li");
        li.className = "candidate";
        li.textContent = candidate.name;
        this.candidateListEl.appendChild(li);
      });

    this.candidateNoteEl.textContent =
      `${info.contest} · ${this.MUSD_2026.electionDate}`;
  }

  renderLegislative(info) {
    this.stateLowerEl.textContent = info.stateLower
      ? `California Assembly · District ${info.stateLower}`
      : "California Assembly · unavailable";

    this.stateUpperEl.textContent = info.stateUpper
      ? `California Senate · District ${info.stateUpper}`
      : "California Senate · unavailable";

    this.federalLowerEl.textContent = info.congressional
      ? `U.S. House · District ${info.congressional}`
      : "U.S. House · unavailable";

    this.federalUpperEl.textContent =
      `U.S. Senate · ${info.stateName || "California"} statewide`;
  }

  initMap() {
    if (this.map) return;

    this.map = L.map(this.mapEl, {
      zoomControl: true,
      attributionControl: true
    });

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(this.map);
  }

  cssVar(name, fallback) {
    const value = getComputedStyle(this).getPropertyValue(name).trim();
    return value || fallback;
  }

  renderMap(trusteeGeojson, lat, lng, areaNumber, address) {
    this.initMap();

    if (this.allAreasLayer) this.allAreasLayer.remove();
    if (this.districtOutlineLayer) this.districtOutlineLayer.remove();
    if (this.areaLabelsLayer) this.areaLabelsLayer.remove();
    if (this.addressMarker) this.addressMarker.remove();

    const accent = this.cssVar("--finder-accent", "#2563eb");

    /*
      Draw only the five validated trustee areas.

      Non-selected areas:
        border YES
        fill NO

      Selected area:
        border YES
        fill YES
    */
    this.allAreasLayer = L.geoJSON(trusteeGeojson, {
      style: feature => {
        const n = Number(feature?.properties?.__trusteeArea);
        const selected = n === areaNumber;

        return {
          color: selected ? accent : "#707070",
          weight: selected ? 3.25 : 1.25,
          opacity: selected ? 1 : .78,
          fill: selected,
          fillColor: selected ? accent : "transparent",
          fillOpacity: selected ? .22 : 0
        };
      }
    }).addTo(this.map);

    /*
      Add a slightly stronger OUTER MUSD border generated from the same
      five trustee areas. Still no fill.
    */
    try {
      const districtUnion = turf.union(
        turf.featureCollection(trusteeGeojson.features)
      );

      if (districtUnion) {
        this.districtOutlineLayer = L.geoJSON(districtUnion, {
          interactive: false,
          style: {
            color: "#3f3f3f",
            weight: 2.15,
            opacity: .92,
            fill: false,
            fillOpacity: 0
          }
        }).addTo(this.map);
      }
    } catch (error) {
      console.warn("Could not create MUSD outer outline:", error);
    }

    /*
      Exactly ONE label per trustee area.
      If the County stores one area in several pieces, they still receive
      just one Area 1 / Area 2 / etc. label.
    */
    this.areaLabelsLayer = L.layerGroup().addTo(this.map);

    for (let n = 1; n <= 5; n++) {
      const group = trusteeGeojson.features.filter(
        feature => Number(feature.properties.__trusteeArea) === n
      );

      if (!group.length) continue;

      let labelPoint;

      try {
        labelPoint = turf.pointOnFeature(
          turf.featureCollection(group)
        );
      } catch (error) {
        console.warn(`Could not place Area ${n} label:`, error);
        continue;
      }

      const coords = labelPoint?.geometry?.coordinates;
      if (!coords) continue;

      const [labelLng, labelLat] = coords;
      const selected = n === areaNumber;

      const icon = L.divIcon({
        className: "area-number-icon",
        html:
          `<div class="area-number-label${selected ? " selected" : ""}">` +
          `Area ${n}</div>`,
        iconSize: [52, 20],
        iconAnchor: [26, 10]
      });

      L.marker([labelLat, labelLng], {
        icon,
        interactive: false,
        keyboard: false,
        zIndexOffset: selected ? 4500 : 1800
      }).addTo(this.areaLabelsLayer);
    }

    /*
      Address marker: pure HTML/CSS.
    */
    const pinIcon = L.divIcon({
      className: "address-pin-icon",
      html: `<div class="address-pin" aria-hidden="true"></div>`,
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });

    this.addressMarker = L.marker([lat, lng], {
      icon: pinIcon,
      zIndexOffset: 10000,
      keyboard: true,
      title: address
    })
      .addTo(this.map)
      .bindPopup(
        `<strong>${this.escapeHtml(address)}</strong><br>` +
        `MUSD Trustee Area ${areaNumber}`
      );

    const bounds = this.allAreasLayer.getBounds();

    requestAnimationFrame(() => {
      this.map.invalidateSize({ pan: false });

      requestAnimationFrame(() => {
        this.map.invalidateSize({ pan: false });

        if (bounds.isValid()) {
          this.map.fitBounds(bounds, {
            padding: [20, 20],
            maxZoom: 11
          });
        } else {
          this.map.setView([lat, lng], 10);
        }
      });
    });
  }

  escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  async handleLookup(event) {
    event.preventDefault();

    const raw = this.addressInput.value.trim();
    if (!raw) return;

    try {
      this.hideSuggestions();
      this.setBusy(true);
      this.setStatus("Finding your districts…");

      /*
        One user action triggers the entire flow:
        address -> normalized address -> MUSD area -> legislative districts.
      */
      const geocoded = await this.censusGeocode(raw);

      const officialMusd =
        await this.officialMusdAreasForPoint(
          geocoded.lat,
          geocoded.lng
        );

      const trusteeGeojson =
        officialMusd.geojson;

      const areaNumber =
        officialMusd.areaNumber;

      const legislative = this.legislativeInfo(
        geocoded.geographies
      );

      this.normalizedAddressEl.textContent =
        geocoded.matchedAddress;

      this.areaValueEl.textContent =
        `Area ${areaNumber}`;

      this.renderCandidates(areaNumber);
      this.renderLegislative(legislative);

      /*
        Put the normalized result back into the input so "Change"
        starts from the confirmed address rather than the raw text.
      */
      this.addressInput.value = geocoded.matchedAddress;

      this.hide(this.searchSection);
      this.show(this.resultsSection);

      this.renderMap(
        trusteeGeojson,
        geocoded.lat,
        geocoded.lng,
        areaNumber,
        geocoded.matchedAddress
      );

      this.setStatus("");

      this.resultsSection.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    } catch (error) {
      console.error(error);
      this.setStatus(
        error.message || "We couldn’t complete the lookup.",
        true
      );

    } finally {
      this.setBusy(false);
    }
  }

  changeAddress() {
    this.hideSuggestions();
    this.hide(this.resultsSection);
    this.show(this.searchSection);
    this.setStatus("");

    requestAnimationFrame(() => {
      this.addressInput.focus();
      this.addressInput.select();
    });
  }
}

customElements.define("musd-district-finder", MusdDistrictFinder);
</script>

</body>
</html>
